services:
  postgres:
    image: postgres:16
    container_name: nickcosmetics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nickcosmetics
      # PATCH22C-DB-PASSWORD: read from infra/docker/.env (git ignores it). Never write the password here.
      POSTGRES_PASSWORD: "${NICK_DB_PASSWORD:?Missing NICK_DB_PASSWORD. Create infra/docker/.env first.}"
      POSTGRES_DB: nickcosmetics
    ports:
      # PATCH21A-PORT-LOCAL: database port is open on this PC only, not on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nickcosmetics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: nickcosmetics-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: nickcosmetics-api
    restart: unless-stopped
    # --loop asyncio avoids a known uvloop DNS resolution bug on
    # Docker Desktop for Windows/WSL2, where container hostnames
    # (e.g. "postgres") intermittently or consistently fail to
    # resolve under uvloop's resolver even though the network is fine.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
    ports:
      # fix_live03: API port open on this PC only (reached from outside through the tunnel).
      - "127.0.0.1:8000:8000"
    environment:
      # fix_live07: database name from NICK_DB_NAME (default nickcosmetics = dev database).
      DATABASE_URL: "postgresql+asyncpg://nickcosmetics:${NICK_DB_PASSWORD:?Missing NICK_DB_PASSWORD. Create infra/docker/.env first.}@postgres:5432/${NICK_DB_NAME:-nickcosmetics}"
      REDIS_URL: redis://redis:6379/0
      # PATCH20A-JWT-KEY: the signing key is read from apps/api/.env (mounted at /app/.env), not set here.
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      # fix_live10: trial signing key from infra/docker/.env (empty = fall back to apps/api/.env, the dev key).
      JWT_SECRET_KEY: "${NICK_TRIAL_JWT_SECRET_KEY:-}"
      # fix_live03: allowed browser origins; set CORS_ALLOW_ORIGINS in infra/docker/.env for the trial.
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8000,http://localhost:8000}"
      # fix_live04: public address of the API and of the admin site (defaults = local use).
      API_PUBLIC_BASE_URL: "${API_PUBLIC_BASE_URL:-http://127.0.0.1:8000}"
      WEB_ADMIN_BASE_URL: "${WEB_ADMIN_BASE_URL:-http://127.0.0.1:5500}"
    volumes:
      - ../../apps/api:/app
      - ../../packages/core:/app/packages/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
