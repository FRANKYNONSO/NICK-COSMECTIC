services:
  postgres:
    image: postgres:16
    container_name: nickcosmetics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nickcosmetics
      # PATCH22C-DB-PASSWORD: read from infra/docker/.env (git ignores it). Never write the password here.
      POSTGRES_PASSWORD: "${NICK_DB_PASSWORD:?Missing NICK_DB_PASSWORD. Create infra/docker/.env first.}"
      POSTGRES_DB: nickcosmetics
    ports:
      # PATCH21A-PORT-LOCAL: database port is open on this PC only, not on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nickcosmetics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: nickcosmetics-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: nickcosmetics-api
    restart: unless-stopped
    # --loop asyncio avoids a known uvloop DNS resolution bug on
    # Docker Desktop for Windows/WSL2, where container hostnames
    # (e.g. "postgres") intermittently or consistently fail to
    # resolve under uvloop's resolver even though the network is fine.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--loop", "asyncio"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://nickcosmetics:${NICK_DB_PASSWORD:?Missing NICK_DB_PASSWORD. Create infra/docker/.env first.}@postgres:5432/nickcosmetics"
      REDIS_URL: redis://redis:6379/0
      # PATCH20A-JWT-KEY: the signing key is read from apps/api/.env (mounted at /app/.env), not set here.
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
    volumes:
      - ../../apps/api:/app
      - ../../packages/core:/app/packages/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
