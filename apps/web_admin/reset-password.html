<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0f17" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Reset Password — Nick Cosmetics Admin</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
  <script src="js/numeric-input-fix.js"></script>
  <script src="ui-dialog.js"></script>
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="swatch-mark"><span></span><span></span><span></span></span>
      <h1 class="display">Nick Cosmetics</h1>
    </div>
    <p class="login-sub">Choose a new password.</p>

    <div id="error-banner" class="error-banner"></div>

    <div id="no-token-panel" style="display:none;text-align:center;padding:12px 0;">
      <p style="color:var(--ink-muted);font-size:13.5px;line-height:1.6;">This link is missing its reset token. Request a new one.</p>
      <a href="forgot-password.html" class="btn btn-primary" style="display:inline-block;width:auto;padding:10px 20px;margin-top:8px;">Request new link</a>
    </div>

    <div id="success-panel" style="display:none;text-align:center;padding:12px 0;">
      <div class="status-icon" style="font-size:34px;">✓</div>
      <h3 class="display" style="font-size:15px;">Password updated</h3>
      <p style="color:var(--ink-muted);font-size:13.5px;line-height:1.6;">You can now sign in with your new password.</p>
      <a href="index.html" class="btn btn-primary" style="display:inline-block;width:auto;padding:10px 20px;margin-top:8px;">Back to Sign In</a>
    </div>

    <form id="reset-form">
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" minlength="8" required autofocus />
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" minlength="8" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Reset password</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('reset-form');
  const errorBanner = document.getElementById('error-banner');
  const submitBtn = document.getElementById('submit-btn');

  if (!token) {
    form.style.display = 'none';
    document.getElementById('no-token-panel').style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.remove('visible');

    const newPassword = document.getElementById('new_password').value;
    if (newPassword !== document.getElementById('confirm_password').value) {
      errorBanner.textContent = 'Passwords do not match.';
      errorBanner.classList.add('visible');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting…';

    try {
      await Api.resetPasswordWithToken(token, newPassword);
      form.style.display = 'none';
      document.getElementById('success-panel').style.display = 'block';
    } catch (err) {
      errorBanner.textContent = err.message;
      errorBanner.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';
    }
  });
</script>

</body>
</html>
